name: Daily bash.com mens (Markham + Fabiani) scrape

on:
  schedule:
    - cron: "0 10 * * *"   # 12:00 SAST nominal — same as the other 3 retailers
    - cron: "0 15 * * *"   # 17:00 SAST RETRY — only if 12:00 saved nothing; runs 2x slower (polite, no bypass)
  workflow_dispatch:

concurrency:
  group: bash-mens-scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # the slower afternoon retry needs more time
    env:
      BASH_MENS_DB_PATH: ${{ github.workspace }}/bash_mens.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decompress existing DB (if present)
        run: |
          if [ -f bash_mens.db.gz ]; then
            gunzip -kf bash_mens.db.gz
          fi

      - name: Skip the retry if today's data is already saved
        if: github.event.schedule == '0 15 * * *'
        run: |
          if [ "$(git log -1 --format=%s)" = "daily scrape $(date -u +%Y-%m-%d)" ]; then
            echo "Today's data already committed by the 12:00 run - retry not needed."
            echo "SKIP=1" >> "$GITHUB_ENV"
          else
            echo "12:00 run saved nothing - retrying at half speed."
            echo "POLITE_SLOW=2" >> "$GITHUB_ENV"
          fi

      - name: Run daily scrape
        if: env.SKIP != '1'
        run: python src/run_bash_mens.py

      - name: Show run status
        if: always()
        run: |
          if [ -f run_status.json ]; then cat run_status.json; fi

      - name: Prune old snapshots (rolling 45-day window)
        if: env.SKIP != '1'
        run: python prune_snapshots.py bash_mens.db 45

      - name: Compress DB for commit
        if: env.SKIP != '1'
        run: |
          if [ -f bash_mens.db ]; then
            gzip -fc bash_mens.db > bash_mens.db.gz
            ls -lh bash_mens.db bash_mens.db.gz
          fi

      - name: Commit DB.gz if healthy + changed
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          git config user.email "actions@github.com"
          git config user.name  "github-actions[bot]"
          if [ -f bash_mens.db.gz ]; then
            git add bash_mens.db.gz
            if git diff --staged --quiet; then
              echo "No DB changes - skipping commit."
            else
              git commit -m "daily scrape $(date -u +%Y-%m-%d)"
              git push
            fi
          else
            echo "No DB produced — nothing to commit."
          fi
